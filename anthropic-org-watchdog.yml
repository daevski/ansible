---
# Standalone playbook to (re-)provision just the Anthropic-org watchdog on
# any host running one or more Hermes Agent instances, without touching
# account/package provisioning. Useful for updating the watchdog alone
# (new org id, new interval, etc) on a host that's already provisioned --
# on a fresh host, prefer hermes-hosts.yml which does both in one run.
#
# Deploys a root systemd service + timer (NOT a Hermes cron job) that
# scans every /home/*/.hermes/.env it can read and alerts via `hermes
# send` on any Anthropic org mismatch. See roles/system/tasks/
# anthropic-org-watchdog.yml for full details.
#
# Usage:
#   ansible-playbook -i inventory/hosts anthropic-org-watchdog.yml --limit bigbox
- hosts: "{{ target | default('all') }}"
  become: yes
  tasks:
    - import_tasks: roles/system/tasks/anthropic-org-watchdog.yml
      tags: anthropic-org-watchdog
  handlers:
    - import_tasks: roles/system/handlers/main.yml
