---
# Deploys the Anthropic-org watchdog to any host running one or more
# Hermes Agent instances. Runs as a root SYSTEM systemd timer (not a
# Hermes cron job, not a --user unit) so it works independently of any
# particular Hermes account being logged in/lingering, and keeps checking
# even if a Hermes gateway on the box is hung or misconfigured.
#
# Scans every /home/*/.hermes/.env it can read (root sees all of them) and
# alerts (via `hermes send`, one specific account's CLI acts as the
# sender) if any resolves to an unexpected Anthropic org.
#
# Requires:
#   - anthropic_personal_org_id in group_vars/all.yml (or host override):
#     the Anthropic org UUID for the personal account that should always
#     be in use.
#   - anthropic_watchdog_sender_account in group_vars/all.yml (or host
#     override): which Hermes account's `hermes` CLI to use for delivering
#     alerts via `hermes send`. Any account with Hermes Agent installed
#     and a working Telegram/Discord/etc platform connection works --
#     alert delivery doesn't depend on that account's own credential being
#     the thing under test.
#
# Idempotent / safe to re-run any number of times (systemd unit files +
# enable are naturally idempotent, unlike Hermes's own `cron create`).

- name: Assert anthropic_personal_org_id is defined
  assert:
    that:
      - anthropic_personal_org_id is defined
      - anthropic_personal_org_id | length > 0
    fail_msg: >-
      anthropic_personal_org_id must be set (group_vars/all.yml or a host
      override) before running anthropic-org-watchdog.yml.

- name: Assert anthropic_watchdog_sender_account is defined
  assert:
    that:
      - anthropic_watchdog_sender_account is defined
      - anthropic_watchdog_sender_account | length > 0
    fail_msg: >-
      anthropic_watchdog_sender_account must be set to a Hermes account
      name (e.g. hermes-1) whose `hermes` CLI will send alerts.

- name: Deploy shared org-id watchdog script
  template:
    src: "{{ playbook_dir }}/roles/system/templates/anthropic-org-watchdog.sh.j2"
    dest: /usr/local/bin/anthropic-org-watchdog.sh
    owner: root
    group: root
    mode: '0755'

- name: Template org-id watchdog config
  template:
    src: "{{ playbook_dir }}/roles/system/templates/anthropic-org-watchdog.conf.j2"
    dest: /etc/anthropic-org-watchdog.conf
    owner: root
    group: root
    mode: '0644'

- name: Install anthropic-org-watchdog systemd service (root, system-level)
  copy:
    src: "{{ playbook_dir }}/roles/system/files/anthropic-org-watchdog.service"
    dest: /etc/systemd/system/anthropic-org-watchdog.service
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd daemon

- name: Install anthropic-org-watchdog systemd timer (root, system-level)
  template:
    src: "{{ playbook_dir }}/roles/system/templates/anthropic-org-watchdog.timer.j2"
    dest: /etc/systemd/system/anthropic-org-watchdog.timer
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd daemon

- name: Flush handlers so the timer unit is loaded before enabling it
  meta: flush_handlers

- name: Enable and start anthropic-org-watchdog.timer
  systemd:
    name: anthropic-org-watchdog.timer
    enabled: yes
    state: started
    daemon_reload: yes
