---
- name: Create hermes-remote user
  user:
    name: hermes-remote
    shell: /bin/bash
    create_home: yes
    groups: []
    password_lock: yes

- name: Create .ssh directory for hermes-remote
  file:
    path: /home/hermes-remote/.ssh
    state: directory
    owner: hermes-remote
    group: hermes-remote
    mode: '0700'

- name: Install hermes public key with SSH restrictions
  authorized_key:
    user: hermes-remote
    path: /home/hermes-remote/.ssh/authorized_keys
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL/sUj1PJERTgOPK7O7tNOiJ7Hkp9jSIlUZzX+pyiSfd livoro@hermes-remote-access"
    key_options: "no-port-forwarding,no-X11-forwarding,no-agent-forwarding"

- name: Configure sshd restrictions for hermes-remote
  blockinfile:
    path: /etc/ssh/sshd_config.d/hermes-remote.conf
    create: yes
    owner: root
    group: root
    mode: '0644'
    marker: "# {mark} hermes-remote access"
    block: |
      Match User hermes-remote
          AllowTcpForwarding no
          X11Forwarding no
  notify: restart sshd
